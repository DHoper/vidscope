<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; width: 280px; font: 14px/1.6 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; color: #182447; background: #EEF1F6; }
    .box { padding: 18px 18px 16px; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 16px; }
    h1 img { width: 22px; height: 22px; }
    p { margin: 0 0 14px; color: #4E5A78; }
    a { display: block; text-align: center; padding: 10px; border-radius: 999px; background: #FFC93C; color: #182447; font-weight: 700; text-decoration: none; }
    a:hover { background: #FFD666; }
    .links { margin: 12px 0 0; text-align: center; font-size: 13px; }
    a.plain { display: inline; padding: 0; background: none; color: #2847D9; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
    a.plain:hover { background: none; }
    a:focus-visible { outline: 3px solid #2847D9; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="box">
    <h1><img src="icons/48.png" alt="">全網搜尋已開啟</h1>
    <p>在 Vidscope 網站搜尋時，會同時搜尋整個網路的影片。</p>
    <a href="https://dhoper.github.io/vidscope/" target="_blank" rel="noopener">打開 Vidscope</a>
    <p class="links"><a class="plain" href="https://github.com/DHoper/vidscope" target="_blank" rel="noopener">使用說明與原始碼</a></p>
  </div>
</body>
</html>
