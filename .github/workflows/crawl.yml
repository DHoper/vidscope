name: Crawl videos

on:
  schedule:
    # 每 3 小時跑一次（UTC）。YouTube 免費配額有限，不建議再更頻繁。
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: '只跑指定來源（空白 = 全部），例如：archive web'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test parsers
        run: node crawler/test.mjs

      # 臨時啟動一個 SearXNG 給全網搜尋用（免費、免金鑰），job 結束就自動消失
      - name: Start SearXNG
        run: |
          docker run -d --name searxng -p 8080:8080 \
            -v "$PWD/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SECRET="$(openssl rand -hex 32)" \
            searxng/searxng:latest
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:8080/search?q=test&format=json" > /dev/null; then
              echo "SearXNG 已啟動"; exit 0
            fi
            sleep 2
          done
          echo "SearXNG 啟動失敗，全網搜尋這次會略過"
          docker logs searxng | tail -50
          # 不讓整個 job 失敗，其他來源照跑
          echo "SEARXNG_FAILED=1" >> "$GITHUB_ENV"

      - name: Crawl
        env:
          SEARXNG_URL: ${{ env.SEARXNG_FAILED != '1' && 'http://localhost:8080' || '' }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          DAILYMOTION_PLAYER_ID: ${{ secrets.DAILYMOTION_PLAYER_ID }}
          ONLY_SOURCES: ${{ github.event.inputs.sources }}
        # ONLY_SOURCES 刻意不加引號，讓 "archive web" 拆成兩個參數
        run: node crawler/index.mjs $ONLY_SOURCES

      - name: Commit data
        run: |
          git config user.name "vidscope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
